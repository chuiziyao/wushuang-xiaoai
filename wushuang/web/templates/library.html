{% extends "base.html" %}
{% block title %}曲库 · {{ app_name }}{% endblock %}
{% block content %}
<style>
  .lib-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .lib-tabs button.on { background:#1a9e5c; color:#fff; border-color:#1a9e5c; }
  .lib-row { display:flex; align-items:flex-start; gap:10px; padding:7px 4px; border-bottom:1px solid #eef1f4; }
  .lib-row input[type=checkbox] { width:16px; height:16px; flex:0 0 auto; margin:3px 0 0; padding:0; }
  .lib-row .tk-play { flex:0 0 auto; width:44px; }
  .lib-meta { flex:1 1 auto; min-width:0; }
  .lib-title { font-weight:600; color:#1c2431; }
  .lib-sub { color:#8a94a3; font-size:.85em; }
  .grp-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #eef1f4; cursor:pointer; }
  .grp-row:hover { background:#f5f7fa; }
  .grp-name { flex:1; font-weight:600; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0; }
</style>

<section class="panel">
  <div class="lib-bar">
    <label style="flex:1">音箱
      <select id="dev"></select>
    </label>
    <button class="primary" onclick="playAll('order')">▶ 顺序播放全部本地</button>
    <button class="primary" onclick="playAll('shuffle')">🔀 随机播放全部本地</button>
  </div>
  <div class="lib-bar lib-tabs" style="margin-top:12px">
    <button id="tab-all" onclick="setMode('all')">全部</button>
    <button id="tab-folder" onclick="setMode('folder')">按文件夹</button>
    <button id="tab-album" onclick="setMode('album')">按专辑</button>
    <button id="tab-artist" onclick="setMode('artist')">按歌手</button>
    <span class="muted small" id="lib-count"></span>
    <button onclick="loadBrowse()" style="margin-left:auto">刷新</button>
  </div>
  <div class="lib-bar" style="margin-top:10px">
    <input id="lib-q" placeholder="搜索本地歌名 / 歌手 / 专辑" style="flex:1"
           onkeydown="if(event.key==='Enter')doSearch()">
    <button class="primary" onclick="doSearch()">搜索</button>
    <button onclick="clearSearch()">清除</button>
    <button class="primary" id="btn-play-artist" style="display:none" onclick="playArtist()">▶ 播放该歌手全部</button>
  </div>
  <div class="toolbar" id="toolbar" style="display:none">
    <label>选中 <span id="sel-count">0</span> 首 →
      <select id="target-pl" onchange="filterPlaylist(this.value)"></select>
    </label>
    <button class="primary" onclick="addToPlaylist()">加入歌单</button>
    <button onclick="removeFromPlaylist()">从该歌单移除</button>
    <button onclick="newPlaylist()">＋ 新建歌单</button>
    <button onclick="selectAll()">全选本页</button>
  </div>
  <div id="crumb" class="muted small" style="margin:6px 0"></div>
  <div id="lib-list"></div>
  <div class="pager" style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap">
    <button onclick="goFirst()">首页</button>
    <button onclick="pageBy(-1)">上一页</button>
    <span id="pg-info" class="muted small">1</span>
    <button onclick="pageBy(1)">下一页</button>
    <button onclick="goLast()">末页</button>
    <input id="pg-jump" type="number" min="1" style="width:80px;margin:0" placeholder="页码"
           onkeydown="if(event.key==='Enter')jumpPage()">
    <button class="primary" onclick="jumpPage()">跳转</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
const DEVICES = {{ devices|tojson }};
const PLAYLISTS = {{ playlists|tojson }};
let mode = 'all', page = 1, folder = '', album = '', artist = '', lastTotal = 0, curDid = '';
let searching = false, searchQ = '', plFilter = null;

function initDev() {
  const sel = document.getElementById('dev');
  sel.innerHTML = DEVICES.map(d => '<option value="' + esc(d.did) + '">' + esc(d.name) + '</option>').join('')
    || '<option value="">无启用设备</option>';
  curDid = localStorage.getItem('player_did') || (DEVICES[0] || {}).did || '';
  sel.value = curDid;
  sel.onchange = () => { curDid = sel.value; localStorage.setItem('player_did', curDid); };
  const pl = document.getElementById('target-pl');
  pl.innerHTML = '<option value="">全部本地（选择歌单可过滤/加入）</option>'
    + PLAYLISTS.map(p => '<option value="' + p.id + '">' + esc(p.name) +
      (p.remark ? '（' + esc(p.remark) + '）' : '') + '</option>').join('');
}
function filterPlaylist(pid) {
  plFilter = pid ? parseInt(pid) : null;
  searching = false; searchQ = '';
  document.getElementById('lib-q').value = '';
  page = 1; loadBrowse();
}
function setMode(m) {
  mode = m; page = 1; folder = ''; album = ''; artist = '';
  searching = false; searchQ = ''; plFilter = null;
  document.getElementById('lib-q').value = '';
  document.getElementById('target-pl').value = '';
  loadBrowse();
}
function tabs() {
  ['all', 'folder', 'album', 'artist'].forEach(m => {
    document.getElementById('tab-' + m).className = (mode === m && !searching && !plFilter ? 'on' : '');
  });
  document.getElementById('btn-play-artist').style.display =
    (mode === 'artist' && artist) ? '' : 'none';
}
async function loadBrowse() {
  tabs();
  let r;
  if (searching) {
    r = await api('/api/library/search?q=' + encodeURIComponent(searchQ));
    r.mode = 'search';
  } else {
    const q = plFilter
      ? '/api/library/browse?mode=playlist&playlist_id=' + plFilter + '&page=' + page + '&page_size=50'
      : '/api/library/browse?mode=' + mode + '&page=' + page + '&page_size=50'
        + (folder ? '&folder=' + encodeURIComponent(folder) : '')
        + (album ? '&album=' + encodeURIComponent(album) : '')
        + (artist ? '&artist=' + encodeURIComponent(artist) : '');
    r = await api(q);
  }
  const list = document.getElementById('lib-list');
  const crumb = document.getElementById('crumb');
  if (r.groups) {
    document.getElementById('toolbar').style.display = 'none';
    crumb.textContent = mode === 'folder' ? '点击文件夹进入'
      : mode === 'album' ? '点击专辑进入' : '点击歌手进入（可一键播放其全部歌曲）';
    document.getElementById('lib-count').textContent = r.groups.length + ' 个分组';
    list.innerHTML = '';
    r.groups.forEach(g => {
      const row = document.createElement('div'); row.className = 'grp-row';
      const nm = document.createElement('span'); nm.className = 'grp-name'; nm.textContent = g.name;
      const ct = document.createElement('span'); ct.className = 'muted small'; ct.textContent = g.count + ' 首';
      const ar = document.createElement('span'); ar.textContent = '›';
      row.append(nm, ct, ar);
      row.onclick = () => drill(g.name);
      list.append(row);
    });
    if (!r.groups.length) list.innerHTML = '<span class="muted small">无本地歌曲，请先在音乐页扫描曲库</span>';
    document.getElementById('pg-info').textContent = '分组';
    lastTotal = 0;
    return;
  }
  document.getElementById('toolbar').style.display = '';
  crumb.textContent = searching ? ('搜索：' + searchQ)
    : plFilter ? ('歌单：' + ((PLAYLISTS.find(p => p.id === plFilter) || {}).name || plFilter))
    : folder ? ('文件夹：' + folder)
    : album ? ('专辑：' + album)
    : artist ? ('歌手：' + artist) : '';
  lastTotal = r.total;
  document.getElementById('lib-count').textContent = r.total + ' 首';
  list.innerHTML = '';
  r.tracks.forEach(t => {
    const row = document.createElement('div'); row.className = 'lib-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'tk-cb'; cb.value = t.id; cb.onchange = selCount;
    const meta = document.createElement('div'); meta.className = 'lib-meta';
    const ti = document.createElement('div'); ti.className = 'lib-title';
    const fname = (t.path || '').split('/').pop() || '';
    ti.textContent = fname.replace(/\.[^.]+$/, '') || t.title || ('#' + t.id);
    ti.title = t.path || '';
    const su = document.createElement('div'); su.className = 'lib-sub';
    su.textContent = (t.artist || '未知歌手') + (t.album ? ' · ' + t.album : '');
    meta.append(ti, su);
    const btn = document.createElement('button');
    btn.className = 'tk-play primary'; btn.textContent = '▶';
    btn.onclick = () => playOne(t.id);
    row.append(cb, meta, btn);
    list.append(row);
  });
  if (!r.tracks.length) list.innerHTML = '<span class="muted small">无结果</span>';
  document.getElementById('pg-info').textContent = searching ? '搜索结果'
    : '第 ' + page + ' / ' + Math.max(1, Math.ceil(r.total / 50)) + ' 页';
  selCount();
}
function drill(name) {
  if (mode === 'folder') folder = name;
  else if (mode === 'album') album = name;
  else artist = name;
  page = 1; loadBrowse();
}
function doSearch() {
  searchQ = document.getElementById('lib-q').value.trim();
  searching = !!searchQ;
  page = 1; loadBrowse();
}
function clearSearch() {
  searching = false; searchQ = '';
  document.getElementById('lib-q').value = '';
  page = 1; loadBrowse();
}
async function playArtist() {
  const r = await run(() => api('/api/library/play_artist?artist=' + encodeURIComponent(artist),
    'POST', { did: curDid, mode: 'order' }), '播放该歌手全部歌曲');
  toast('共 ' + r.count + ' 首', true);
}
function pageBy(d) {
  if (!lastTotal || searching) return;
  page = Math.min(Math.max(1, Math.ceil(lastTotal / 50)), Math.max(1, page + d));
  loadBrowse();
}
function maxPage() { return Math.max(1, Math.ceil(lastTotal / 50)); }
function goFirst() { if (lastTotal && !searching) { page = 1; loadBrowse(); } }
function goLast() { if (lastTotal && !searching) { page = maxPage(); loadBrowse(); } }
function jumpPage() {
  if (!lastTotal || searching) return;
  const v = parseInt(document.getElementById('pg-jump').value, 10);
  if (!v) { toast('请输入页码', false); return; }
  page = Math.min(maxPage(), Math.max(1, v));
  loadBrowse();
}
function selected() {
  return [...document.querySelectorAll('.tk-cb:checked')].map(c => parseInt(c.value));
}
function selCount() {
  document.getElementById('sel-count').textContent = selected().length;
}
function selectAll() {
  const cbs = [...document.querySelectorAll('.tk-cb')];
  const all = cbs.every(c => c.checked);
  cbs.forEach(c => { c.checked = !all; });
  selCount();
}
async function playOne(id) {
  await run(() => api('/api/player/play', 'POST', { did: curDid, track_id: id }), '已开始播放');
}
async function playAll(m) {
  const r = await run(() => api('/api/library/play_all', 'POST', { did: curDid, mode: m }),
    m === 'shuffle' ? '随机播放全部本地' : '顺序播放全部本地');
  toast('共 ' + r.count + ' 首', true);
}
async function addToPlaylist() {
  const pid = parseInt(document.getElementById('target-pl').value);
  const ids = selected();
  if (!pid) { toast('请先新建歌单', false); return; }
  if (!ids.length) { toast('请先勾选歌曲', false); return; }
  await run(() => api('/api/playlists/' + pid + '/tracks', 'POST', { track_ids: ids }),
    '已加入 ' + ids.length + ' 首');
}
async function removeFromPlaylist() {
  const pid = parseInt(document.getElementById('target-pl').value);
  const ids = selected();
  if (!pid || !ids.length) { toast('请选择歌单并勾选歌曲', false); return; }
  await run(() => api('/api/playlists/' + pid + '/tracks', 'DELETE', { track_ids: ids }),
    '已移除 ' + ids.length + ' 首');
}
async function newPlaylist() {
  const name = prompt('新歌单名称（建议纯数字，便于语音点播）');
  if (!name || !name.trim()) return;
  const remark = prompt('备注（可选，给人看）') || '';
  const r = await run(() => api('/api/playlists', 'POST',
    { name: name.trim(), source: 'local', remark }), '歌单已创建');
  const pl = document.getElementById('target-pl');
  pl.innerHTML += '<option value="' + r.id + '">' + esc(name.trim()) + '</option>';
  pl.value = r.id;
  filterPlaylist(r.id);
}
initDev(); loadBrowse();
</script>
{% endblock %}
