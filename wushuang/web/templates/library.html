{% extends "base.html" %}
{% block title %}曲库 · {{ app_name }}{% endblock %}
{% block content %}
<style>
  .lib-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .lib-bar label { margin:0; display:flex; align-items:center; gap:8px; flex:1; min-width:200px; font-weight:500; white-space:nowrap; }
  .lib-bar label select { margin-top:0; }
  .lib-bar input { margin-top:0; }
  .lib-tabs { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .lib-tabs button { border-radius:999px; padding:6px 14px; }
  .lib-tabs button.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .lib-tabs button.on:hover { color:#fff; filter:brightness(1.05); background:var(--ok); }
  .lib-tabs .refresh { margin-left:auto; border-radius:8px; }
  #pl-filter { width:auto; min-width:200px; max-width:320px; }
  #ctx-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0 4px;
             padding:10px 12px; background:#f5f8ff; border:1px solid #dbe6fb; border-radius:10px; }
  #ctx-bar .ctx-title { font-weight:700; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #ctx-bar .back { border-radius:8px; padding:5px 10px; flex:0 0 auto; }
  #ctx-bar .ctx-actions { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0 6px;
             padding:10px 12px; background:#f8fafc; border:1px solid var(--line); border-radius:10px; }
  .toolbar .sel-info { font-size:13px; color:var(--muted); white-space:nowrap; }
  .toolbar .sel-info b { color:var(--primary); font-size:15px; }
  .toolbar .spacer { flex:1; }
  .lib-row { display:flex; align-items:center; gap:12px; padding:8px 10px;
             border-bottom:1px solid #eef1f4; border-radius:8px; transition:background .12s; }
  .lib-row:hover { background:#f7f9fc; }
  .lib-row.checked { background:#eef4ff; }
  .lib-row input[type=checkbox] { width:16px; height:16px; flex:0 0 auto; margin:0; padding:0; cursor:pointer; }
  .lib-meta { flex:1 1 auto; min-width:0; }
  .lib-title { font-weight:600; color:#1c2431; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lib-sub { color:#8a94a3; font-size:.85em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lib-dur { flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .tk-play { flex:0 0 auto; width:44px; height:34px; border-radius:8px; padding:0; }
  .grp-row { display:flex; align-items:center; gap:12px; padding:10px;
             border-bottom:1px solid #eef1f4; border-radius:10px; cursor:pointer; transition:background .12s; }
  .grp-row:hover { background:#f5f7fa; }
  .grp-icon { font-size:19px; flex:0 0 auto; width:38px; height:38px; display:flex;
              align-items:center; justify-content:center; background:#eef2f8; border-radius:10px; }
  .grp-meta { flex:1; min-width:0; }
  .grp-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grp-sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grp-actions { display:flex; gap:6px; flex:0 0 auto; }
  .grp-arrow { color:#b6bfcc; font-size:18px; flex:0 0 auto; }
  .list-hint { margin:10px 2px 4px; }
  .empty { text-align:center; color:var(--muted); padding:28px 0; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .pager button { border-radius:8px; }
  .pager input { width:80px; margin:0; }
  @media (max-width:640px) {
    .grp-actions button { padding:3px 8px; font-size:12px; }
    .lib-dur { display:none; }
    #pl-filter { min-width:140px; }
  }
</style>

<section class="panel">
  <div class="lib-bar">
    <label>播放到
      <select id="dev"></select>
    </label>
    <button class="primary" onclick="playAll('order')">▶ 顺序播放全部</button>
    <button onclick="playAll('shuffle')">🔀 随机播放全部</button>
  </div>

  <div class="lib-tabs">
    <button id="tab-all" onclick="setMode('all')">全部</button>
    <button id="tab-folder" onclick="setMode('folder')">📁 按文件夹</button>
    <button id="tab-album" onclick="setMode('album')">💿 按专辑</button>
    <button id="tab-artist" onclick="setMode('artist')">🎤 按歌手</button>
    <span class="muted small" id="lib-count"></span>
    <button class="refresh" onclick="loadBrowse()">刷新</button>
  </div>

  <div class="lib-bar" style="margin-top:12px">
    <input id="lib-q" placeholder="搜索本地歌名 / 歌手 / 专辑" style="flex:1"
           onkeydown="if(event.key==='Enter')doSearch()">
    <button class="primary" onclick="doSearch()">搜索</button>
    <button onclick="clearSearch()">清除</button>
    <select id="pl-filter" title="按歌单过滤曲目" onchange="filterPlaylist(this.value)"></select>
  </div>

  <div id="ctx-bar" style="display:none">
    <button class="back" onclick="backToGroups()">‹ 返回</button>
    <span class="ctx-title" id="ctx-title"></span>
    <span class="ctx-actions" id="ctx-actions"></span>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <span class="sel-info">已选 <b id="sel-count">0</b> 首</span>
    <button class="primary" onclick="addToPlaylist()">加入歌单</button>
    <button onclick="newPlaylist()">＋ 新建歌单</button>
    <button id="btn-remove" class="danger" style="display:none" onclick="removeFromPlaylist()">从歌单移除</button>
    <span class="spacer"></span>
    <button onclick="selectAll()">全选本页</button>
    <button onclick="clearSel()">清空选择</button>
  </div>

  <div id="lib-list"></div>

  <div class="pager">
    <button onclick="goFirst()">首页</button>
    <button onclick="pageBy(-1)">上一页</button>
    <span id="pg-info" class="muted small">1</span>
    <button onclick="pageBy(1)">下一页</button>
    <button onclick="goLast()">末页</button>
    <input id="pg-jump" type="number" min="1" placeholder="页码"
           onkeydown="if(event.key==='Enter')jumpPage()">
    <button class="primary" onclick="jumpPage()">跳转</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
const DEVICES = {{ devices|tojson }};
let PLAYLISTS = {{ playlists|tojson }};
let mode = 'all', page = 1, folder = '', album = '', artist = '', lastTotal = 0, curDid = '';
let searching = false, searchQ = '', plFilter = null;
let curTracks = [];
const sel = new Set();  // 跨页/跨视图保留勾选，加入歌单不再丢选择
const PAGE_SIZE = 50;
const GROUP_ICON = { folder: '📁', album: '💿', artist: '🎤' };
const GROUP_LABEL = { folder: '文件夹', album: '专辑', artist: '歌手' };

function initDev() {
  const s = document.getElementById('dev');
  s.innerHTML = DEVICES.map(d => '<option value="' + esc(d.did) + '">' + esc(d.name) + '</option>').join('')
    || '<option value="">无启用设备</option>';
  curDid = localStorage.getItem('player_did') || (DEVICES[0] || {}).did || '';
  if (!DEVICES.some(d => d.did === curDid)) curDid = (DEVICES[0] || {}).did || '';
  s.value = curDid;
  s.onchange = () => { curDid = s.value; localStorage.setItem('player_did', curDid); };
}
function rebuildFilterSelect() {
  const s = document.getElementById('pl-filter');
  s.innerHTML = '<option value="">全部本地（可按歌单过滤）</option>'
    + PLAYLISTS.map(p => '<option value="' + p.id + '">' + esc(p.name) +
        (p.remark ? '（' + esc(p.remark) + '）' : '') + '</option>').join('');
  s.value = plFilter ? String(plFilter) : '';
}
async function refreshPlaylists() {
  try {
    const r = await api('/api/player/playlists');
    PLAYLISTS = r.playlists;
    rebuildFilterSelect();
  } catch (e) { /* 静默：下拉稍后刷新 */ }
}
function filterPlaylist(pid) {
  plFilter = pid ? parseInt(pid) : null;
  searching = false; searchQ = '';
  document.getElementById('lib-q').value = '';
  page = 1; loadBrowse();
}
function setMode(m) {
  mode = m; page = 1; folder = ''; album = ''; artist = '';
  searching = false; searchQ = ''; plFilter = null;
  document.getElementById('lib-q').value = '';
  rebuildFilterSelect();
  loadBrowse();
}
function backToGroups() {
  if (plFilter) { plFilter = null; rebuildFilterSelect(); }
  else { folder = ''; album = ''; artist = ''; }
  page = 1; loadBrowse();
}
function tabs() {
  ['all', 'folder', 'album', 'artist'].forEach(m => {
    document.getElementById('tab-' + m).className = (mode === m && !searching && !plFilter ? 'on' : '');
  });
}
function drillName() { return folder || album || artist; }
function drillKind() { return folder ? 'folder' : album ? 'album' : artist ? 'artist' : ''; }

function renderCtx() {
  const bar = document.getElementById('ctx-bar');
  const title = document.getElementById('ctx-title');
  const acts = document.getElementById('ctx-actions');
  acts.innerHTML = '';
  const mk = (label, cls, fn) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.onclick = fn; acts.appendChild(b); return b;
  };
  if (plFilter) {
    const pl = PLAYLISTS.find(p => p.id === plFilter) || {};
    title.textContent = '歌单：' + (pl.name || plFilter);
    mk('▶ 播放歌单', 'primary', () => playPlaylistFilter());
    bar.style.display = '';
  } else if (drillName()) {
    const kind = drillKind(), name = drillName();
    title.textContent = GROUP_LABEL[kind] + '：' + (kind === 'folder' ? baseName(name) : name);
    mk('▶ 一键播放', 'primary', () => playGroup(kind, name, 'order'));
    mk('🔀 随机播放', '', () => playGroup(kind, name, 'shuffle'));
    mk('＋ 生成同名歌单', '', () => makeGroupPlaylist(kind, name));
    bar.style.display = '';
  } else {
    bar.style.display = 'none';
  }
}
function baseName(p) { return String(p).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p; }
function parentName(p) {
  const parts = String(p).replace(/[\\/]+$/, '').split(/[\\/]/);
  parts.pop();
  return parts.join('/');
}

async function loadBrowse() {
  tabs(); renderCtx();
  let r;
  if (searching) {
    r = await api('/api/library/search?q=' + encodeURIComponent(searchQ));
    r.mode = 'search';
  } else {
    const q = plFilter
      ? '/api/library/browse?mode=playlist&playlist_id=' + plFilter + '&page=' + page + '&page_size=' + PAGE_SIZE
      : '/api/library/browse?mode=' + mode + '&page=' + page + '&page_size=' + PAGE_SIZE
        + (folder ? '&folder=' + encodeURIComponent(folder) : '')
        + (album ? '&album=' + encodeURIComponent(album) : '')
        + (artist ? '&artist=' + encodeURIComponent(artist) : '');
    r = await api(q);
  }
  const list = document.getElementById('lib-list');
  if (r.groups) {
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('lib-count').textContent = r.groups.length + ' 个分组';
    list.innerHTML = '<div class="list-hint muted small">点击行进入' + GROUP_LABEL[mode] +
      '；右侧按钮可一键播放、一键生成同名歌单</div>';
    r.groups.forEach(g => list.appendChild(groupRow(g)));
    if (!r.groups.length)
      list.innerHTML = '<div class="empty">无本地歌曲，请先在「音乐」页扫描曲库</div>';
    document.getElementById('pg-info').textContent = '分组';
    lastTotal = 0; curTracks = [];
    return;
  }
  document.getElementById('toolbar').style.display = '';
  document.getElementById('btn-remove').style.display = plFilter ? '' : 'none';
  lastTotal = r.total; curTracks = r.tracks;
  document.getElementById('lib-count').textContent = r.total + ' 首';
  list.innerHTML = '';
  r.tracks.forEach(t => list.appendChild(trackRow(t)));
  if (!r.tracks.length)
    list.innerHTML = '<div class="empty">' + (searching ? '没有匹配的曲目' : '这里还没有歌曲') + '</div>';
  document.getElementById('pg-info').textContent = searching ? '搜索结果'
    : '第 ' + page + ' / ' + Math.max(1, Math.ceil(r.total / PAGE_SIZE)) + ' 页';
  selCount();
}

function groupRow(g) {
  const kind = mode;
  const row = document.createElement('div'); row.className = 'grp-row';
  const icon = document.createElement('span'); icon.className = 'grp-icon';
  icon.textContent = GROUP_ICON[kind] || '📁';
  const meta = document.createElement('div'); meta.className = 'grp-meta';
  const nm = document.createElement('div'); nm.className = 'grp-name';
  nm.textContent = kind === 'folder' ? baseName(g.name) : g.name;
  nm.title = g.name;
  const sub = document.createElement('div'); sub.className = 'grp-sub';
  sub.textContent = g.count + ' 首' + (kind === 'folder' && parentName(g.name) ? ' · ' + parentName(g.name) : '');
  meta.append(nm, sub);
  const acts = document.createElement('span'); acts.className = 'grp-actions';
  const bp = document.createElement('button');
  bp.className = 'small primary'; bp.textContent = '▶ 播放'; bp.title = '一键播放全部';
  bp.onclick = e => { e.stopPropagation(); playGroup(kind, g.name, 'order'); };
  const bl = document.createElement('button');
  bl.className = 'small'; bl.textContent = '＋ 歌单'; bl.title = '一键生成同名歌单';
  bl.onclick = e => { e.stopPropagation(); makeGroupPlaylist(kind, g.name); };
  acts.append(bp, bl);
  const ar = document.createElement('span'); ar.className = 'grp-arrow'; ar.textContent = '›';
  row.append(icon, meta, acts, ar);
  row.onclick = () => drill(g.name);
  return row;
}

function trackRow(t) {
  const row = document.createElement('div'); row.className = 'lib-row';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'tk-cb'; cb.value = t.id;
  cb.checked = sel.has(t.id);
  if (cb.checked) row.classList.add('checked');
  cb.onchange = () => {
    if (cb.checked) sel.add(t.id); else sel.delete(t.id);
    row.classList.toggle('checked', cb.checked);
    selCount();
  };
  const meta = document.createElement('div'); meta.className = 'lib-meta';
  const ti = document.createElement('div'); ti.className = 'lib-title';
  const fname = (t.path || '').split(/[\\/]/).pop() || '';
  const isVideo = /\.(mp4|m4v|mov|mkv|webm|avi|flv|ts|wmv|mpg|mpeg)$/i.test(t.path || '');
  ti.textContent = (isVideo ? '🎬 ' : '') + (fname.replace(/\.[^.]+$/, '') || t.title || ('#' + t.id));
  ti.title = t.path || '';
  const su = document.createElement('div'); su.className = 'lib-sub';
  const parts = [];
  if (t.artist) parts.push(t.artist);
  if (t.album) parts.push(t.album);
  if (!parts.length && t.path) parts.push(baseName(parentName(t.path)));
  su.textContent = parts.join(' · ');
  meta.append(ti, su);
  const dur = document.createElement('span'); dur.className = 'lib-dur muted small';
  dur.textContent = fmtDur(t.duration);
  const btn = document.createElement('button');
  btn.className = 'tk-play primary'; btn.textContent = '▶'; btn.title = '播放这首';
  btn.onclick = () => playOne(t.id);
  row.append(cb, meta, dur, btn);
  return row;
}

function drill(name) {
  if (mode === 'folder') folder = name;
  else if (mode === 'album') album = name;
  else artist = name;
  page = 1; loadBrowse();
}
function doSearch() {
  searchQ = document.getElementById('lib-q').value.trim();
  searching = !!searchQ;
  page = 1; loadBrowse();
}
function clearSearch() {
  searching = false; searchQ = '';
  document.getElementById('lib-q').value = '';
  page = 1; loadBrowse();
}

/* ---------- 选择 ---------- */
function selCount() { document.getElementById('sel-count').textContent = sel.size; }
function syncChecks() {
  document.querySelectorAll('.tk-cb').forEach(c => {
    c.checked = sel.has(parseInt(c.value));
    c.closest('.lib-row').classList.toggle('checked', c.checked);
  });
  selCount();
}
function selectAll() {
  const ids = curTracks.map(t => t.id);
  const all = ids.length && ids.every(id => sel.has(id));
  ids.forEach(id => { if (all) sel.delete(id); else sel.add(id); });
  syncChecks();
}
function clearSel() { sel.clear(); syncChecks(); }

/* ---------- 播放 ---------- */
function needDevice() {
  if (!curDid) { toast('无启用设备，请先到「设备」页启用音箱', false); return false; }
  return true;
}
async function playOne(id) {
  if (!needDevice()) return;
  await run(() => api('/api/player/play', 'POST', { did: curDid, track_id: id }), '已开始播放');
}
async function playAll(m) {
  if (!needDevice()) return;
  const r = await run(() => api('/api/library/play_all', 'POST', { did: curDid, mode: m }));
  toast((m === 'shuffle' ? '随机播放' : '顺序播放') + '全部本地，共 ' + r.count + ' 首');
}
async function playGroup(kind, name, m) {
  if (!needDevice()) return;
  const r = await run(() => api('/api/library/play_group', 'POST',
    { did: curDid, kind, name, mode: m || 'order' }));
  toast((m === 'shuffle' ? '随机播放' : '开始播放') + '「' + baseName(name) + '」，共 ' + r.count + ' 首');
}
async function playPlaylistFilter() {
  if (!needDevice() || !plFilter) return;
  await run(() => api('/api/player/play', 'POST', { did: curDid, playlist_id: plFilter }), '歌单播放中');
}
async function makeGroupPlaylist(kind, name) {
  const r = await run(() => api('/api/library/make_playlist', 'POST', { kind, name }));
  await refreshPlaylists();
  toast(r.created
    ? '已生成歌单「' + r.name + '」，收录 ' + r.total + ' 首'
    : '歌单「' + r.name + '」已存在，补齐 ' + r.added + ' 首（共 ' + r.total + ' 首）');
}

/* ---------- 加入歌单（修复：新建歌单不再清空列表/丢选择） ---------- */
function addToPlaylist() {
  if (!sel.size) { toast('请先勾选歌曲', false); return; }
  openAddModal(false);
}
function newPlaylist() { openAddModal(true); }

function openAddModal(focusNew) {
  const n = sel.size;
  const existing = PLAYLISTS.length ? (
    '<label class="modal-field">选择已有歌单' +
    '<select id="add-existing">' + PLAYLISTS.map(p =>
      '<option value="' + p.id + '"' + (p.id === plFilter ? ' selected' : '') + '>' +
      esc(p.name) + (p.remark ? '（' + esc(p.remark) + '）' : '') + '</option>').join('') +
    '</select></label>' +
    '<div class="modal-actions" style="margin-top:8px">' +
    '<button class="primary" id="add-existing-ok"' + (n ? '' : ' disabled') + '>加入所选歌单</button></div>' +
    '<div class="sep">或新建歌单</div>'
  ) : '<p class="muted small">还没有歌单，先新建一个：</p>';
  const mask = openModal(
    '<h3>' + (n ? '加入歌单 <span class="muted small">已选 ' + n + ' 首</span>' : '新建歌单') + '</h3>' +
    existing +
    '<label class="modal-field">新歌单名称' +
    '<input id="add-name" placeholder="例如：评书精选（纯数字名便于语音点播）"></label>' +
    '<label class="modal-field">备注（可选，给人看）' +
    '<input id="add-remark" placeholder="例如：单田芳专辑"></label>' +
    '<div class="modal-actions">' +
    '<button id="add-cancel">取消</button>' +
    '<button class="primary" id="add-new-ok">' + (n ? '新建并加入 ' + n + ' 首' : '新建歌单') + '</button></div>');
  mask.querySelector('#add-cancel').onclick = closeModal;
  const existOk = mask.querySelector('#add-existing-ok');
  if (existOk) existOk.onclick = async () => {
    const s = mask.querySelector('#add-existing');
    const pid = parseInt(s.value);
    const pl = PLAYLISTS.find(p => p.id === pid) || {};
    await doAddTracks(pid, pl.name || String(pid));
  };
  mask.querySelector('#add-new-ok').onclick = async () => {
    const name = mask.querySelector('#add-name').value.trim();
    if (!name) { toast('请填写歌单名称', false); return; }
    const remark = mask.querySelector('#add-remark').value.trim();
    await doCreateAndAdd(name, remark);
  };
  mask.querySelector('#add-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); mask.querySelector('#add-new-ok').click(); }
  });
  if (focusNew || !PLAYLISTS.length) setTimeout(() => mask.querySelector('#add-name').focus(), 40);
}

async function doAddTracks(pid, plName) {
  const ids = [...sel];
  if (!ids.length) { toast('请先勾选歌曲', false); return; }
  const r = await run(() => api('/api/playlists/' + pid + '/tracks', 'POST', { track_ids: ids }));
  closeModal();
  toast('已加入 ' + (r.changed != null ? r.changed : ids.length) + ' 首到「' + plName + '」');
  refreshPlaylists();
}

async function doCreateAndAdd(name, remark) {
  // 关键修复：创建后停留在当前视图、保留勾选，选中歌曲直接加入新歌单
  const r = await run(() => api('/api/playlists', 'POST', { name, source: 'local', remark }));
  PLAYLISTS.push({ id: r.id, name, remark, source: 'local' });
  rebuildFilterSelect();
  const ids = [...sel];
  if (ids.length) {
    await run(() => api('/api/playlists/' + r.id + '/tracks', 'POST', { track_ids: ids }));
    closeModal();
    toast('已创建歌单「' + name + '」并加入 ' + ids.length + ' 首');
  } else {
    closeModal();
    toast('歌单「' + name + '」已创建，勾选歌曲后即可加入');
  }
  refreshPlaylists();
}

async function removeFromPlaylist() {
  const ids = [...sel];
  if (!plFilter || !ids.length) { toast('请先在歌单视图中勾选歌曲', false); return; }
  const r = await run(() => api('/api/playlists/' + plFilter + '/tracks', 'DELETE', { track_ids: ids }));
  ids.forEach(id => sel.delete(id));
  toast('已从歌单移除 ' + (r.changed != null ? r.changed : ids.length) + ' 首');
  loadBrowse();
}

/* ---------- 分页 ---------- */
function maxPage() { return Math.max(1, Math.ceil(lastTotal / PAGE_SIZE)); }
function pageBy(d) {
  if (!lastTotal || searching) return;
  page = Math.min(maxPage(), Math.max(1, page + d));
  loadBrowse();
}
function goFirst() { if (lastTotal && !searching) { page = 1; loadBrowse(); } }
function goLast() { if (lastTotal && !searching) { page = maxPage(); loadBrowse(); } }
function jumpPage() {
  if (!lastTotal || searching) return;
  const v = parseInt(document.getElementById('pg-jump').value, 10);
  if (!v) { toast('请输入页码', false); return; }
  page = Math.min(maxPage(), Math.max(1, v));
  loadBrowse();
}

initDev(); rebuildFilterSelect(); loadBrowse();
</script>
