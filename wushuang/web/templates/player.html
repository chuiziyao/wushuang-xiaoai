{% extends "base.html" %}
{% block title %}播放控制 · {{ app_name }}{% endblock %}
{% block content %}
<style>
  .pbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .np-card { background:#1c2431; color:#fff; border-radius:12px; padding:16px; }
  .np-title { font-size:1.25em; font-weight:700; }
  .np-sub { color:#9fb0c8; margin-top:4px; font-size:.9em; }
  .ctl-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
  .ctl-grid button { font-size:1.3em; padding:12px 0; border-radius:10px; }
  .mode-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .mode-row button.on { background:#1a9e5c; color:#fff; border-color:#1a9e5c; }
  .vol-row { display:flex; gap:10px; align-items:center; margin-top:12px; color:#9fb0c8; }
  .vol-row input[type=range] { flex:1; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chips button { border-radius:999px; padding:8px 14px; }
  .tk-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #eef1f4; }
  .tk-meta { flex:1; min-width:0; }
  .tk-title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tk-artist { color:#8a94a3; font-size:.85em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tk-play { flex:none; width:44px; height:36px; border-radius:8px; }
  .pager { display:flex; gap:10px; align-items:center; justify-content:center; margin-top:10px; }
  @media (max-width:640px){ .ctl-grid button{font-size:1.5em; padding:16px 0;} }
</style>

<section class="panel">
  <div class="pbar">
    <label style="flex:1">音箱
      <select id="dev" onchange="onDevice()"></select>
    </label>
    <button onclick="loadState()">刷新</button>
  </div>
  <div class="pbar" style="margin-top:12px">
    <span class="muted small">音箱状态：</span>
    <button id="mode-wushuang" onclick="setMode('wushuang')">无双小爱</button>
    <button id="mode-native" onclick="setMode('native')">小爱原始</button>
    <span class="muted small" id="mode-hint"></span>
  </div>
  <div class="alert err" id="xiaomi-warn" style="display:none;margin-top:12px"></div>
  <div class="np-card" style="margin-top:12px">
    <div class="np-title" id="np-title">未在播放</div>
    <div class="np-sub" id="np-sub">点下面的歌或歌单开始播放</div>
    <div class="ctl-grid">
      <button onclick="ctl('prev')" title="上一首">⏮</button>
      <button onclick="togglePlay()" id="btn-toggle" title="暂停/继续">⏯</button>
      <button onclick="ctl('next')" title="下一首">⏭</button>
      <button onclick="ctl('stop')" title="停止">⏹</button>
    </div>
    <div class="mode-row">
      <button id="m-order" onclick="ctl('loop_all')">列表循环</button>
      <button id="m-one" onclick="ctl('loop_one')">单曲循环</button>
      <button id="m-shuffle" onclick="ctl('shuffle')">随机播放</button>
    </div>
    <div class="vol-row">
      <button onclick="ctl('volume_down')">🔉</button>
      <input type="range" id="vol" min="0" max="100" onchange="ctl('volume_set', this.value)">
      <button onclick="ctl('volume_up')">🔊</button>
      <span id="vol-num" style="width:3em;text-align:right">—</span>
    </div>
  </div>
</section>

<section class="panel">
  <h3>原生指令 <span class="muted small">直接让小爱执行（新闻/天气/米家等）</span></h3>
  <div class="chips" id="native-presets"></div>
  <div class="pbar" style="margin-top:10px">
    <input id="native-text" placeholder="自定义指令，如：播放今天的新闻" style="flex:1"
           onkeydown="if(event.key==='Enter')sendNative()">
    <button class="primary" onclick="sendNative()">发送</button>
  </div>
</section>

<section class="panel">
  <h3>歌单</h3>
  <div class="chips" id="pl-chips"><span class="muted small">加载中…</span></div>
</section>

<section class="panel">
  <h3>曲库 <span class="badge" id="tk-total">0</span></h3>
  <div class="pbar">
    <input id="q" placeholder="搜索歌名 / 歌手 / 专辑" style="flex:1"
           onkeydown="if(event.key==='Enter')doSearch()">
    <button class="primary" onclick="doSearch()">搜索</button>
    <button onclick="clearSearch()">全部</button>
  </div>
  <div id="tk-list" style="margin-top:8px"></div>
  <div class="pager">
    <button onclick="pageBy(-1)">上一页</button>
    <span id="pg-info" class="muted small">1</span>
    <button onclick="pageBy(1)">下一页</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
const DEVICES = {{ devices|tojson }};
const PRESETS = ['播放今天的新闻', '今天天气怎么样', '讲个笑话', '播放睡前故事', '播放轻音乐', '现在开始播报新闻'];
let curDid = localStorage.getItem('player_did') || '';
let page = 1, searching = false, lastTotal = 0, volDragging = false;

function initDevices() {
  const sel = document.getElementById('dev');
  sel.innerHTML = DEVICES.map(d =>
    '<option value="' + esc(d.did) + '">' + esc(d.name) + '（' + esc(d.hardware) + '）</option>').join('');
  if (!DEVICES.length) { sel.innerHTML = '<option value="">无启用设备</option>'; return; }
  if (!curDid || !DEVICES.some(d => d.did === curDid)) curDid = DEVICES[0].did;
  sel.value = curDid;
}
function onDevice() {
  curDid = document.getElementById('dev').value;
  localStorage.setItem('player_did', curDid);
  loadState(); loadPlaylists(); page = 1; loadTracks();
}
async function loadState() {
  if (!curDid) return;
  try {
    const s = await api('/api/player/state?did=' + encodeURIComponent(curDid));
    const warn = document.getElementById('xiaomi-warn');
    if (s.xiaomi_status && s.xiaomi_status !== 'ok') {
      warn.style.display = '';
      warn.textContent = '⚠️ 小米登录态异常（' + s.xiaomi_status +
        '）：推流/播报会失败。请到「账号」页重新米家扫码登录。';
    } else {
      warn.style.display = 'none';
    }
    const mode = s.mode || 'wushuang';
    document.getElementById('mode-wushuang').className = mode === 'wushuang' ? 'primary' : '';
    document.getElementById('mode-native').className = mode === 'native' ? 'primary' : '';
    document.getElementById('mode-hint').textContent = mode === 'wushuang'
      ? '拦截点歌/大模型；新闻天气等原生技能仍放行'
      : '全部指令交给小爱原生；说「小爱同学，变身」可切回';
    const np = s.now_playing;
    document.getElementById('np-title').textContent = np ? np.title : '未在播放';
    document.getElementById('np-sub').textContent = np
      ? (np.artist || '未知歌手') + ' · ' + np.playlist + '（' + np.index + '/' + np.total + '）'
        + (np.paused ? ' · 已暂停' : '')
      : '点下面的歌或歌单开始播放';
    document.getElementById('btn-toggle').textContent = (np && np.paused) ? '▶' : '⏯';
    const loopMode = np ? np.mode : 'order';
    document.getElementById('m-order').className = loopMode === 'order' ? 'on' : '';
    document.getElementById('m-one').className = loopMode === 'loop_one' ? 'on' : '';
    document.getElementById('m-shuffle').className = loopMode === 'shuffle' ? 'on' : '';
    if (s.volume != null && !volDragging) {
      document.getElementById('vol').value = s.volume;
      document.getElementById('vol-num').textContent = s.volume;
    }
  } catch (e) { /* 静默 */ }
}
async function setMode(mode) {
  await run(() => api('/api/player/mode', 'POST', { did: curDid, mode }),
            mode === 'wushuang' ? '已切换：无双小爱状态' : '已切换：小爱原始状态');
  loadState();
}
async function togglePlay() {
  const paused = document.getElementById('btn-toggle').textContent === '▶';
  await ctl(paused ? 'resume' : 'pause');
}
async function ctl(action, value) {
  if (!curDid) { toast('请先选择音箱', false); return; }
  const body = { did: curDid, action };
  if (value != null) body.value = parseInt(value);
  await run(() => api('/api/player/control', 'POST', body));
  loadState();
}
async function playTrack(id) {
  await run(() => api('/api/player/play', 'POST', { did: curDid, track_id: id }), '已开始播放');
  loadState();
}
async function playPlaylist(id) {
  await run(() => api('/api/player/play', 'POST', { did: curDid, playlist_id: id }), '歌单播放中');
  loadState();
}
async function sendNative(text) {
  const t = (text || document.getElementById('native-text').value).trim();
  if (!t) { toast('请输入指令', false); return; }
  await run(() => api('/api/player/native', 'POST', { did: curDid, text: t }), '已发送：' + t);
  document.getElementById('native-text').value = '';
}
function renderPresets() {
  document.getElementById('native-presets').innerHTML = PRESETS.map(p =>
    '<button onclick="sendNative(\'' + esc(p) + '\')">' + esc(p) + '</button>').join('');
}
async function loadPlaylists() {
  const r = await api('/api/player/playlists');
  document.getElementById('pl-chips').innerHTML = r.playlists.length
    ? r.playlists.map(p => '<button onclick="playPlaylist(' + p.id + ')">▶ ' +
        esc(p.name) + (p.remark ? '（' + esc(p.remark) + '）' : '') +
        ' · ' + p.count + '首</button>').join('')
    : '<span class="muted small">暂无歌单</span>';
}
function tkRow(t) {
  return '<div class="tk-row"><div class="tk-meta"><div class="tk-title">' + esc(t.title) +
    '</div><div class="tk-artist">' + esc(t.artist || '未知歌手') +
    (t.album ? ' · ' + esc(t.album) : '') + '</div></div>' +
    '<button class="tk-play primary" onclick="playTrack(' + t.id + ')">▶</button></div>';
}
async function loadTracks() {
  const r = searching
    ? await api('/api/player/search?q=' + encodeURIComponent(document.getElementById('q').value))
    : await api('/api/player/tracks?page=' + page + '&page_size=50');
  lastTotal = r.total != null ? r.total : r.tracks.length;
  document.getElementById('tk-total').textContent = lastTotal;
  document.getElementById('tk-list').innerHTML = r.tracks.length
    ? r.tracks.map(tkRow).join('') : '<span class="muted small">无结果</span>';
  document.getElementById('pg-info').textContent = searching ? '搜索结果' : ('第 ' + page + ' 页');
}
function doSearch() { searching = !!document.getElementById('q').value.trim(); page = 1; loadTracks(); }
function clearSearch() { document.getElementById('q').value = ''; searching = false; page = 1; loadTracks(); }
function pageBy(d) {
  if (searching) return;
  const maxPage = Math.max(1, Math.ceil(lastTotal / 50));
  page = Math.min(maxPage, Math.max(1, page + d));
  loadTracks();
}
document.getElementById('vol').addEventListener('input', function () {
  volDragging = true; document.getElementById('vol-num').textContent = this.value;
});
document.getElementById('vol').addEventListener('change', function () { volDragging = false; });
initDevices(); renderPresets(); loadState(); loadPlaylists(); loadTracks();
setInterval(loadState, 4000);
</script>
{% endblock %}
