[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wushuang-xiaoai"
version = "0.6.0"
description = "无双小爱同学 —— 小米音箱统一增强服务（大模型对话 + 自由听歌），面向群晖 NAS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wushuang-xiaoai contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "mutagen>=1.47",
    "aiosqlite>=0.20",
    "cryptography>=42",
    "croniter>=2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
wushuang = "wushuang.__main__:main"

[tool.setuptools.packages.find]
include = ["wushuang*"]

[tool.setuptools.package-data]
wushuang = ["web/templates/*.html", "web/static/*", "vendor/miservice/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
