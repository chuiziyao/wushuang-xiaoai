plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wushuang.remote'
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.wushuang.remote'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.4.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：仅 Android framework（WebView + Activity），构建快、体积小
