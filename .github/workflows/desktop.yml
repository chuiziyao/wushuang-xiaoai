name: desktop-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS-arm64
          - os: macos-13
            label: macOS-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux 原生窗口依赖（WebKitGTK / PyGObject 构建）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev \
            pkg-config gcc python3-dev gir1.2-webkit2-4.1 gir1.2-gtk-3.0

      - name: 安装项目与构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: 单元测试
        run: |
          pip install pytest pytest-asyncio
          python -m pytest -q

      - name: 构建单文件桌面版
        run: python scripts/build_desktop.py --skip-deps

      - uses: actions/upload-artifact@v4
        with:
          name: wushuang-desktop-${{ matrix.label }}
          path: dist/desktop/*.zip
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true